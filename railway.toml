[deploy]
# Keep the container always running
restartPolicyType = "always"

# Healthcheck on "/" — Next.js serves this and returns 200
# Do NOT use "/health" — that's a FastAPI route on port 6001,
# not accessible on the public-facing Next.js port that Railway checks.
healthcheckPath = "/"
healthcheckTimeout = 300

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
