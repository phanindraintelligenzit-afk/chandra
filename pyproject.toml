[project]
name = "chandra"
version = "0.1.0"
description = "Chandra — autonomous Digital Cloud Engineer agent for AWS (cost, security, compliance, performance, reliability)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Chandra Team" }]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-aws>=0.2",
    "langchain-core>=0.3",
    "streamlit>=1.36",
    "plotly>=5.22",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "tenacity>=8.5",
    "jinja2>=3.1",
    "pytz>=2026.2",
    "openai>=1.68.2",
    "openai-agents>=0.0.15",
    "anthropic>=0.49.0",
    "langchain-openai>=1.2.1",
    "gradio>=6.14.0",
    "aioboto3>=15.5.0",
    "playwright>=1.60.0",
    "jira>=3.10.5",
    "psycopg2>=2.9.12",
    "langchain-community>=0.4.2",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp>=1.42.1",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langchain-mcp-adapters>=0.3.0",
    "json-repair>=0.61.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "moto[all]>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-requests",
    "freezegun>=1.5",
]

[project.scripts]
chandra = "chandra.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chandra"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# E402/PLC0415 in tests: runnable node scripts and fixtures set AWS env vars
# (and activate moto) before importing the modules under test.
"tests/**" = ["PLR2004", "S101", "E402", "PLC0415"]
# typer.Option in argument defaults is the canonical Typer API.
"src/chandra/cli.py" = ["B008"]
# Alembic bootstraps sys.path/config before imports by convention.
"src/chandra/db/migrations/env.py" = ["E402"]
# Deliberate process-wide singletons guarded by module globals.
"src/chandra/aws/client_factory.py" = ["PLW0603"]
"src/chandra/db/session.py" = ["PLW0603"]
"src/chandra/logging.py" = ["PLW0603"]
# LLM prompt templates are long literal strings that cannot be wrapped
# without changing the prompt the model receives.
"src/chandra/digital_worker/decision_engine.py" = ["E501"]
"src/chandra/digital_worker/verifier.py" = ["E501"]
# Deliberate shared-checkpointer module global + long debug f-strings.
"tests/test_hitl_context_isolation.py" = ["PLW0603", "E501"]
# Long inline test payloads + xfail-reason strings (recovery of gate churn).
"tests/unit/test_analyze_ranking.py" = ["E501"]
"tests/unit/test_digital_worker_graph.py" = ["E501"]
"tests/unit/test_digital_worker_intake.py" = ["E501"]
"tests/unit/test_digital_worker_planning.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
# The codebase imports via `from src.chandra...`, so modules must resolve
# under the repo root. mypy_path = "src" made every file resolvable under
# two names (chandra.* and src.chandra.*), which aborted every run with
# "source file found twice under different module names".
mypy_path = "."

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
    "moto.*",
    "streamlit.*",
    "pandas.*",
    "plotly.*",
    "psycopg_pool.*",
    "langgraph.*",
    "langgraph_checkpoint_postgres.*",
    "langchain_aws.*",
    "jira.*",
    "dotenv.*",
]
ignore_missing_imports = true

# The legacy root-level services (digitalworker_agents/, root tools/,
# copilot_agents/) are pre-src/ drift never held to strict typing. They
# enter `mypy src` scope only because src/chandra/digital_worker/graph.py
# imports digitalworker_agents.aws_execution_agent. Follow imports for
# type info, but don't gate src/chandra on that untyped tree. src.chandra.*
# stays fully type-checked. (Re-applied — lost in a main merge.)
[[tool.mypy.overrides]]
module = [
    "digitalworker_agents.*",
    "copilot_agents.*",
    "tools.aws_cloud_tools.*",
    "tools.jira_tools.*",
    "tools.langchain_tools",
]
follow_imports = "skip"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: tests requiring docker/Postgres/AWS",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src/chandra"]

[tool.coverage.report]
show_missing = true
skip_covered = true
