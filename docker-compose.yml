services:

  fastapi:
    build: .
    image: chandra-app
    command: ["uvicorn", "fastapi_app:app", "--host", "0.0.0.0", "--port", "6001"]
    ports:
      - "6001:6001"
    env_file: .env
    restart: unless-stopped

  gradio:
    image: chandra-app
    command: ["uv", "run", "app.py"]
    ports:
      - "7861:7861"
    env_file: .env
    depends_on:
      fastapi:
        condition: service_started
    restart: unless-stopped
