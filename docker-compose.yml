services:

  backend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/backend}
    image: chandra-app
    command: ["uvicorn", "fastapi_app:app", "--host", "0.0.0.0", "--port", "6001"]
    ports:
      - "6001:6001"
    env_file: .env
    environment:
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/backend}
    restart: unless-stopped
    networks:
      - chandra-network

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    volumes:
      - .:/app
    command: ["npm", "start"]
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/backend}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - chandra-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - FRONTEND_HOST=${FRONTEND_HOST:-localhost}
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - chandra-network

  gradio:
    image: chandra-app
    command: ["uv", "run", "app.py"]
    ports:
      - "7861:7861"
    env_file: .env
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - chandra-network

networks:
  chandra-network:
    driver: bridge
