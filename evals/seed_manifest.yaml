# Ground-truth manifest for the synthetic env.
#
# Each entry describes one seeded misconfiguration. Expected ARNs are filled in
# at apply time by `terraform output -json seeds` and injected into a copy of
# this manifest by `evals/harness.py` before scoring. The static fields
# (description, severity, kra) document intent.
#
# Keep this file as the single source of truth for what the demo seeds.

seeds:
  - detector_id: SEC-001-public-s3
    kra: security
    severity: critical
    description: >-
      S3 bucket with Public Access Block disabled and a permissive
      bucket policy (Principal:"*"). Mirrors the most common
      data-exposure incident in cloud breach reports.

  - detector_id: SEC-002-open-sg-ssh
    kra: security
    severity: critical
    description: >-
      Security group exposing TCP/22 to 0.0.0.0/0, attached to a
      t3.micro EC2. The textbook "SSH on the public internet" finding.

  - detector_id: SEC-003-stale-key
    kra: security
    severity: high
    description: >-
      IAM user with an active access key intended to be 120 days old.
      Since AWS does not allow backdating CreateDate, the eval honors
      CHANDRA_STALE_KEY_DAYS_OVERRIDE=0 to make this seed surface
      deterministically without waiting 90 days.

  - detector_id: SEC-004-wildcard-iam
    kra: security
    severity: critical
    description: >-
      Customer-managed IAM policy with Action:* on Resource:*.
      Equivalent to AdministratorAccess but harder to spot in audits.

  - detector_id: COST-001-idle-ec2
    kra: cost
    severity: medium
    description: >-
      Running t3.small with no workload. The eval requires the
      instance to be older than 24h before treating it as eligible.

  - detector_id: COST-002-unattached-ebs
    kra: cost
    severity: low
    description: >-
      gp3 volume in "available" state — paying for storage with no consumer.

  - detector_id: COMP-001-rds-unencrypted
    kra: compliance
    severity: critical
    description: >-
      db.t3.micro RDS Postgres with storage_encrypted = false.

  - detector_id: COMP-002-no-cloudtrail
    kra: compliance
    severity: critical
    description: >-
      No multi-region, logging, log-file-validation-enabled CloudTrail
      exists in the account. The synthetic env asserts this is true on
      a fresh burner — do NOT add a trail before eval.

  - detector_id: PERF-001-no-asg
    kra: performance
    severity: medium
    description: >-
      Production-tagged EC2 (Environment=prod) running outside any
      Auto Scaling group.

  - detector_id: REL-001-rds-single-az
    kra: reliability
    severity: high
    description: >-
      Production-tagged RDS with multi_az = false.

# Threshold gates for the harness. Failure (exit 1) if either is breached.
thresholds:
  recall_overall: 0.80
  recall_per_kra: 0.70
